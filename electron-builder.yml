appId: io.github.no-colours-fabric.ncf-agent-interconnect
productName: NCF Agent Interconnect
publish: null
afterPack: scripts/write-launcher-identity.mjs
afterSign: scripts/write-launcher-identity.mjs
asar:
  unpack:
    - build/assets/codex-win-socket.exe
    - build/assets/codex-win-pipe.exe
    - build/assets/codex-stdio-shim.exe
    - build/assets/codex-console-stop.exe
electronDist: node_modules/electron/dist
directories:
  output: release
fileOptions:
  files:
    - build/**/*
    - package.json
    - '!**/*.map'
  extraResources:
    - from: distribution/README.md
      to: README.md
    - from: docs/aionui-setup.md
      to: guides/AionUi.md
    - from: docs/claude-code-adapter.md
      to: guides/ClaudeCode.md
    - from: LICENSE
      to: licenses/NCF-Agent-Interconnect.LICENSE.txt
    - from: THIRD_PARTY_NOTICES.md
      to: licenses/THIRD_PARTY_NOTICES.md
    - from: node_modules/electron/dist/LICENSE
      to: licenses/Electron.LICENSE.txt
    - from: node_modules/electron/dist/LICENSES.chromium.html
      to: licenses/Chromium.LICENSES.html
artifactName: NCF-Agent-Interconnect-${version}-${os}-${arch}.${ext}
mac:
  category: public.app-category.developer-tools
  bundleShortVersion: '1.1.0'
  bundleVersion: '1.1.0a9'
  sign:
    identity: '-'
    hardenedRuntime: false
  extendInfo:
    NCFReleaseVersion: '1.1.0-alpha-9-20261126T192806'
    NSLocalNetworkUsageDescription: Exchange messages and files with nodes explicitly configured by the user.
  icon: build/assets/icon.icns
  target:
    - dmg
win:
  icon: build/assets/icon.ico
  fileOptions:
    extraResources:
      - from: desktop/assets/chatgpt-ncf.ico
        to: icons/chatgpt-ncf.ico
      - from: build/assets/ncf-update-preflight.exe
        to: tools/ncf-update-preflight.exe
  target:
    - nsis
nsis:
  include: desktop/installer/windows-update.nsh
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  installerLanguages:
    - en_US
  displayLanguageSelector: false
linux:
  icon: build/assets/icon.png
  target:
    - AppImage
