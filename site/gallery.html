<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#faf9f6" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Image archive — NCF Agent Interconnect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:wght@400;700&family=Rubik:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="./assets/app-icon.png" type="image/png" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./translations.js" defer></script>
    <script src="./app.js" defer></script>
  </head>
  <body class="gallery-page">
    <a class="skip-link" href="#main" data-copy="skip">Skip to content</a>
    <div class="language-scrim" id="language-scrim" aria-hidden="true"></div>
    <section
      class="language-panel"
      id="language-panel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="language-panel-title"
      aria-hidden="true"
      inert
    >
      <div class="language-panel-heading">
        <h2 id="language-panel-title">Choose a language</h2>
        <button
          class="language-close"
          id="language-close"
          type="button"
          aria-label="Close language selection"
        >
          ×
        </button>
      </div>
      <div class="language-options" id="language-options"></div>
    </section>
    <header class="site-header">
      <a
        class="brand"
        href="./index.html"
        aria-label="NCF Agent Interconnect — back to the story"
        data-aria="galleryBrandLabel"
        ><img src="./assets/app-icon.png" width="38" height="38" alt="" /><span
          >NCF <span class="brand-secondary">Agent Interconnect</span></span
        ></a
      >
      <nav class="main-nav" aria-label="Image archive navigation" data-aria="galleryNavLabel">
        <a href="./index.html" data-copy="galleryBack">Back to the story</a>
      </nav>
      <button
        class="language-trigger"
        id="language-trigger"
        type="button"
        aria-haspopup="dialog"
        aria-expanded="false"
        aria-controls="language-panel"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9" />
          <path
            d="M3 12h18M12 3c2.5 2.4 3.8 5.4 3.8 9s-1.3 6.6-3.8 9c-2.5-2.4-3.8-5.4-3.8-9S9.5 5.4 12 3Z"
          /></svg
        ><span id="current-language">English</span>
      </button>
    </header>
    <main id="main" class="gallery-main">
      <p class="eyebrow" data-copy="galleryEyebrow">Image archive</p>
      <h1 data-copy="galleryTitle">Every original illustration</h1>
      <p class="gallery-intro" data-copy="galleryIntro">
        All images remain in this prototype, including those no longer used at full size in the
        comic. Each caption is the asset filename.
      </p>
      <section class="gallery-section" aria-labelledby="developer-title">
        <h2 id="developer-title" data-copy="galleryDeveloper">Developer</h2>
        <div class="gallery-grid">
          <figure>
            <img
              loading="lazy"
              src="./assets/developer/hero.png"
              alt="Developer at the desk, hero image"
            />
            <figcaption>assets/developer/hero.png</figcaption>
          </figure>
          <figure>
            <img loading="lazy" src="./assets/developer/scene-01.png" alt="Developer, scene 01" />
            <figcaption>assets/developer/scene-01.png</figcaption>
          </figure>

            <figcaption>assets/developer/scene-07.png</figcaption>
          </figure>
          <figure>
            <img loading="lazy" src="./assets/developer/scene-08.png" alt="Developer, scene 08" />
            <figcaption>assets/developer/scene-08.png</figcaption>

          <figure>

          <figure>

            <figcaption>assets/developer/scene-19.png</figcaption>
          </figure>
        </div>
      </section>
      <section class="gallery-section" aria-labelledby="agents-title">
        <h2 id="agents-title" data-copy="galleryAgents">Agent tablets</h2>
        <div class="gallery-grid">
          <figure>
            <img loading="lazy" src="./assets/agents/morgan.png" alt="Morgan agent tablet" />

      <section class="gallery-section" aria-labelledby="brand-title">
        <h2 id="brand-title" data-copy="galleryBrand">Brand asset</h2>
        <div class="gallery-grid">
          <figure>
            <img loading="lazy" src="./assets/app-icon.png" alt="NCF Agent Interconnect app icon" />
            <figcaption>assets/app-icon.png</figcaption>
          </figure>
        </div>
      </section>
    </main>
  </body>
</html>
