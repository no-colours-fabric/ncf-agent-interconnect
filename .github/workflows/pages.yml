name: Publish website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'README.md'
      - 'llms.txt'
      - 'docs/*.md'
      - 'docs/scenarios/*.md'
      - 'docs/assets/agents-preview.png'
      - 'docs/assets/app-preview.png'
      - 'distribution/README.md'
      - 'scripts/pages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/configure-pages@v5
      - name: Install documentation renderer
        run: npm ci --prefix scripts/pages --ignore-scripts
      - name: Build static documentation
        run: node scripts/pages/build.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .local/pages-artifact
      - id: deployment
        uses: actions/deploy-pages@v4
