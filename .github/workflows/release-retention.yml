name: Keep installers only for the latest release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-asset-retention
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    steps:
      - name: Remove older uploaded assets and preserve tags and release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_RELEASE_ID: ${{ github.event.release.id }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/latest" > "$RUNNER_TEMP/latest-release.json"
          latest_id=$(jq -r '.id' "$RUNNER_TEMP/latest-release.json")
          latest_date=$(jq -r '.published_at' "$RUNNER_TEMP/latest-release.json")
          if [ "$GITHUB_EVENT_NAME" = release ] && [ "$EVENT_RELEASE_ID" != "$latest_id" ]; then
            echo 'The published release is not Latest; no assets removed.'
            exit 0
          fi
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          jq -r --argjson latest "$latest_id" --arg cutoff "$latest_date" \
            '.[] | select(.draft == false and .id != $latest and .published_at <= $cutoff) | .assets[].id' \
            "$RUNNER_TEMP/releases.json" > "$RUNNER_TEMP/old-release-assets.txt"
          while IFS= read -r asset_id; do
            gh api --method DELETE "repos/$GH_REPO/releases/assets/$asset_id"
          done < "$RUNNER_TEMP/old-release-assets.txt"
          count=$(wc -l < "$RUNNER_TEMP/old-release-assets.txt")
          echo "Removed $count old assets. Latest installers, tags and release descriptions retained." >> "$GITHUB_STEP_SUMMARY"
